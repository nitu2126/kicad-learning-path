<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" width="680" height="384" font-family="Arial, Helvetica, sans-serif">
<title>555 astable LED blinker timing diagram</title>
<desc>Capacitor voltage ramping between one third and two thirds of VCC, and the resulting output pin 3 square wave. The LED lights while the output is low.</desc>
<rect x="0.5" y="0.5" width="679" height="383" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328">555 astable LED blinker: timing diagram (steady state)</text>
<text x="340" y="41" text-anchor="middle" font-size="11" fill="#57606a">VCC = 5 V, R1 = 4.7 kΩ, R2 = 68 kΩ, C1 = 10 µF  →  T ≈ 0.975 s, f ≈ 1.02 Hz</text>
<line x1="130.0" y1="50" x2="130.0" y2="320" stroke="#eaeef2"/>
<line x1="263.3" y1="50" x2="263.3" y2="320" stroke="#eaeef2"/>
<line x1="396.6" y1="50" x2="396.6" y2="320" stroke="#eaeef2"/>
<line x1="529.9" y1="50" x2="529.9" y2="320" stroke="#eaeef2"/>
<line x1="130" y1="50.0" x2="650" y2="50.0" stroke="#d0d7de"/>
<line x1="130" y1="103.3" x2="650" y2="103.3" stroke="#8c959f" stroke-dasharray="5 4"/>
<line x1="130" y1="156.7" x2="650" y2="156.7" stroke="#8c959f" stroke-dasharray="5 4"/>
<line x1="130" y1="210" x2="650" y2="210" stroke="#6e7781"/>
<text x="122" y="54.0" text-anchor="end" font-size="11" fill="#57606a">VCC = 5 V</text>
<text x="122" y="107.3" text-anchor="end" font-size="11" fill="#57606a">2/3 VCC = 3.33 V</text>
<text x="122" y="160.7" text-anchor="end" font-size="11" fill="#57606a">1/3 VCC = 1.67 V</text>
<text x="122" y="214.0" text-anchor="end" font-size="11" fill="#57606a">0 V</text>
<line x1="264.3" y1="50" x2="264.3" y2="312" stroke="#afb8c1" stroke-dasharray="2 4"/>
<line x1="390.0" y1="50" x2="390.0" y2="312" stroke="#afb8c1" stroke-dasharray="2 4"/>
<line x1="524.3" y1="50" x2="524.3" y2="312" stroke="#afb8c1" stroke-dasharray="2 4"/>
<text x="136" y="68" font-size="12" font-weight="bold" fill="#0969da">Capacitor C1 voltage (pins 2 and 6)</text>
<path d="M130.0 156.7 L139.6 151.5 L149.2 146.6 L158.8 141.9 L168.4 137.5 L178.0 133.3 L187.6 129.3 L197.2 125.4 L206.8 121.8 L216.4 118.3 L226.0 115.0 L235.6 111.9 L245.2 108.9 L254.7 106.0 L264.3 103.3 L273.3 108.5 L282.3 113.4 L291.3 118.1 L300.2 122.5 L309.2 126.7 L318.2 130.7 L327.2 134.6 L336.1 138.2 L345.1 141.7 L354.1 145.0 L363.1 148.1 L372.0 151.1 L381.0 154.0 L390.0 156.7 L399.6 151.5 L409.2 146.6 L418.8 141.9 L428.4 137.5 L438.0 133.3 L447.6 129.3 L457.2 125.4 L466.8 121.8 L476.4 118.3 L486.0 115.0 L495.6 111.9 L505.2 108.9 L514.7 106.0 L524.3 103.3 L533.3 108.5 L542.3 113.4 L551.3 118.1 L560.2 122.5 L569.2 126.7 L578.2 130.7 L587.2 134.6 L596.1 138.2 L605.1 141.7 L614.1 145.0 L623.1 148.1 L632.0 151.1 L641.0 154.0 L650.0 156.7" fill="none" stroke="#0969da" stroke-width="2.2" stroke-linejoin="round"/>
<text x="270.3" y="86" font-size="10" fill="#1f2328" stroke="#ffffff" stroke-width="3" paint-order="stroke">2/3 VCC reached: THR trips, OUT goes low</text>
<text x="396.0" y="178" font-size="10" fill="#1f2328" stroke="#ffffff" stroke-width="3" paint-order="stroke">1/3 VCC reached: TRIG trips, OUT goes high</text>
<text x="136" y="238" font-size="12" font-weight="bold" fill="#1f2328" stroke="#ffffff" stroke-width="4" paint-order="stroke">Output (pin 3): the LED lights while the output is LOW</text>
<rect x="264.3" y="262" width="125.7" height="50" fill="#f59e0b" fill-opacity="0.25"/>
<text x="327.2" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2328">LED ON</text>
<text x="327.2" y="303" text-anchor="middle" font-size="11" fill="#1f2328">tL = 0.471 s</text>
<rect x="524.3" y="262" width="125.7" height="50" fill="#f59e0b" fill-opacity="0.25"/>
<text x="587.2" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2328">LED ON</text>
<text x="587.2" y="303" text-anchor="middle" font-size="11" fill="#1f2328">tL = 0.471 s</text>
<text x="197.2" y="254" text-anchor="middle" font-size="11" fill="#1f2328">tH = 0.504 s (LED off)</text>
<text x="457.2" y="254" text-anchor="middle" font-size="11" fill="#1f2328">tH = 0.504 s (LED off)</text>
<path d="M130 262 H264.3 V312 H390.0 V262 H524.3 V312 H650" fill="none" stroke="#1f2328" stroke-width="2.2"/>
<text x="122" y="266" text-anchor="end" font-size="11" fill="#57606a">HIGH</text>
<text x="122" y="316" text-anchor="end" font-size="11" fill="#57606a">LOW</text>
<text x="130.0" y="336" text-anchor="middle" font-size="11" fill="#57606a">0</text>
<text x="263.3" y="336" text-anchor="middle" font-size="11" fill="#57606a">0.5</text>
<text x="396.6" y="336" text-anchor="middle" font-size="11" fill="#57606a">1.0</text>
<text x="529.9" y="336" text-anchor="middle" font-size="11" fill="#57606a">1.5</text>
<text x="650" y="336" text-anchor="end" font-size="11" fill="#57606a">time (s)</text>
<line x1="130.0" y1="352" x2="390.0" y2="352" stroke="#1f2328"/>
<line x1="130.0" y1="347" x2="130.0" y2="357" stroke="#1f2328"/>
<line x1="390.0" y1="347" x2="390.0" y2="357" stroke="#1f2328"/>
<text x="260.0" y="372" text-anchor="middle" font-size="11" fill="#1f2328">T = tH + tL = 0.975 s</text>
<line x1="390.0" y1="352" x2="650.0" y2="352" stroke="#1f2328"/>
<line x1="390.0" y1="347" x2="390.0" y2="357" stroke="#1f2328"/>
<line x1="650.0" y1="347" x2="650.0" y2="357" stroke="#1f2328"/>
<text x="520.0" y="372" text-anchor="middle" font-size="11" fill="#1f2328">T = tH + tL = 0.975 s</text>
</svg>