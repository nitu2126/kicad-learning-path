<text x="96" y="76.0" font-size="11" fill="#1f2328">CUTOFF: no base current, VCE = 5 V (switch OFF)</text>
<text x="333.1" y="166.4" font-size="11" fill="#1f2328">ACTIVE: VCE = VCC − β·IB·RL (amplifier)</text>
