<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Collector-emitter voltage versus base current</title><desc>VCE falls as base current rises, then flattens at about 0.2 V in saturation. The circuit operates at 10.4 mA, far into saturation.</desc>
