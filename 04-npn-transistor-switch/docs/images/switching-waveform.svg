<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 484" width="680" height="484" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>NPN transistor switch with an inductive load: switching waveforms</title><desc>Button, base voltage, load current and collector voltage over time. The collector voltage is clamped at VCC plus the diode drop while the flyback diode carries the coil current.</desc>
<rect x="0.5" y="0.5" width="679" height="483" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328">NPN transistor switch driving an inductive load: switching waveforms</text>
<text x="340" y="41" text-anchor="middle" font-size="11" fill="#57606a">VCC = 5 V, R1 = 390 Ω, PN2222A, 1N4148 flyback diode. Load: 70 Ω, 100 mH coil (assumed). Contact bounce ignored.</text>
<line x1="110.0" y1="58" x2="110.0" y2="440" stroke="#eaeef2"/>
<text x="110.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">0</text>
<line x1="200.0" y1="58" x2="200.0" y2="440" stroke="#eaeef2"/>
<text x="200.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">2</text>
<line x1="290.0" y1="58" x2="290.0" y2="440" stroke="#eaeef2"/>
<text x="290.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">4</text>
<line x1="380.0" y1="58" x2="380.0" y2="440" stroke="#eaeef2"/>
<text x="380.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">6</text>
<line x1="470.0" y1="58" x2="470.0" y2="440" stroke="#eaeef2"/>
<text x="470.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">8</text>
<line x1="560.0" y1="58" x2="560.0" y2="440" stroke="#eaeef2"/>
<text x="560.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">10</text>
<line x1="650.0" y1="58" x2="650.0" y2="440" stroke="#eaeef2"/>
<text x="650.0" y="456" text-anchor="middle" font-size="11" fill="#57606a">12</text>
<text x="650" y="472" text-anchor="end" font-size="11" fill="#57606a">time (ms)</text>
<line x1="155.0" y1="58" x2="155.0" y2="440" stroke="#afb8c1" stroke-dasharray="2 4"/>
<line x1="470.0" y1="58" x2="470.0" y2="440" stroke="#afb8c1" stroke-dasharray="2 4"/>
<line x1="588.7" y1="58" x2="588.7" y2="440" stroke="#afb8c1" stroke-dasharray="2 4"/>
<text x="110" y="62" font-size="12" font-weight="bold" fill="#1f2328">SW1 (button)</text>
<path d="M110 100 H155.0 V74 H470.0 V100 H650" fill="none" stroke="#1f2328" stroke-width="2.2"/>
<text x="102" y="78" text-anchor="end" font-size="11" fill="#57606a">pressed</text>
<text x="102" y="104" text-anchor="end" font-size="11" fill="#57606a">open</text>
<text x="110" y="128" font-size="12" font-weight="bold" fill="#8250df">BASE voltage (TP3)</text>
<path d="M110 184.0 H155.0 V139.0 H470.0 V184.0 H650" fill="none" stroke="#8250df" stroke-width="2.2"/>
<text x="102" y="143.0" text-anchor="end" font-size="11" fill="#57606a">0.9 V</text>
<text x="102" y="188.0" text-anchor="end" font-size="11" fill="#57606a">0 V</text>
<text x="163.0" y="133.0" font-size="11" fill="#1f2328">VBE(sat) about 0.9 V, IB about 10.4 mA</text>
<text x="110" y="214" font-size="12" font-weight="bold" fill="#cf222e">Load current (coil at J2)</text>
<path d="M110 300.0 L155.0 300.0 L155.0 300.0 L162.9 292.9 L170.8 286.6 L178.6 281.0 L186.5 276.1 L194.4 271.7 L202.2 267.9 L210.1 264.5 L218.0 261.4 L225.9 258.8 L233.8 256.4 L241.6 254.3 L249.5 252.5 L257.4 250.8 L265.2 249.4 L273.1 248.1 L281.0 247.0 L288.9 246.0 L296.8 245.1 L304.6 244.3 L312.5 243.6 L320.4 243.0 L328.2 242.5 L336.1 242.0 L344.0 241.5 L351.9 241.2 L359.8 240.8 L367.6 240.5 L375.5 240.3 L383.4 240.1 L391.2 239.9 L399.1 239.7 L407.0 239.5 L414.9 239.4 L422.8 239.2 L430.6 239.1 L438.5 239.0 L446.4 238.9 L454.2 238.9 L462.1 238.8 L470.0 238.7 L473.0 242.0 L475.9 245.2 L478.9 248.2 L481.9 251.0 L484.8 253.8 L487.8 256.4 L490.8 258.8 L493.7 261.2 L496.7 263.5 L499.7 265.7 L502.6 267.7 L505.6 269.7 L508.6 271.6 L511.5 273.4 L514.5 275.1 L517.5 276.8 L520.4 278.3 L523.4 279.8 L526.4 281.3 L529.3 282.6 L532.3 283.9 L535.3 285.2 L538.2 286.4 L541.2 287.5 L544.2 288.6 L547.1 289.6 L550.1 290.6 L553.1 291.6 L556.0 292.5 L559.0 293.3 L562.0 294.2 L564.9 294.9 L567.9 295.7 L570.9 296.4 L573.8 297.1 L576.8 297.7 L579.8 298.4 L582.7 299.0 L585.7 299.5 L588.7 300.0 L650 300.0" fill="none" stroke="#cf222e" stroke-width="2.2" stroke-linejoin="round"/>
<text x="102" y="242.3" text-anchor="end" font-size="11" fill="#57606a">68.6 mA</text>
<text x="102" y="304.0" text-anchor="end" font-size="11" fill="#57606a">0 mA</text>
<text x="209.0" y="226.3" font-size="11" fill="#1f2328">rises with τ = L/R ≈ 1.4 ms</text>
<text x="480.0" y="271.0" font-size="11" fill="#1f2328">decays through D2 in about 2.6 ms</text>
<text x="110" y="344" font-size="12" font-weight="bold" fill="#0969da">COLLECTOR voltage (TP4)</text>
<path d="M110 376.0 H155.0 V433.6 H470.0 V365.2 H588.7 V376.0 H650" fill="none" stroke="#0969da" stroke-width="2.2"/>
<path d="M473.0 365.2 V347.2" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="480.0" y="351.2" font-size="10" fill="#cf222e">without D2: a spike limited only by breakdown (not to scale)</text>
<text x="102" y="366.2" text-anchor="end" font-size="11" fill="#57606a">5.9 V</text>
<text x="102" y="385.0" text-anchor="end" font-size="11" fill="#57606a">5.0 V</text>
<text x="102" y="437.6" text-anchor="end" font-size="11" fill="#57606a">0.2 V</text>
<text x="163.0" y="427.6" font-size="11" fill="#1f2328">VCE(sat) about 0.2 V</text>
<text x="596.7" y="379.2" font-size="11" fill="#1f2328">clamped at VCC + VF = 5.9 V</text>
</svg>